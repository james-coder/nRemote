name: Build & Release

# Builds the "no-libs" nRemote.jar, runs the calculator-free tests, and, when
# the VERSION file names a version that has no tag yet, publishes a GitHub
# Release with the jar attached. So: bump VERSION, push to master, and a new
# release appears. Releases are the single place end users download the jar.
#
# The real TI NavNet libraries are proprietary and not in the repo, so the code
# is compiled against the signature-only stubs in ci/stubs/. The result contains
# only nRemote's own classes and links against the real TI classes at runtime.
# Java 7 bytecode, because the TI software bundles a Java 7 JRE.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write   # for the release step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need tags to tell if this VERSION is already released

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile (Java 7 target, against CI stubs)
        run: |
          set -e
          mkdir -p build
          find ci/stubs -name '*.java' > sources.txt
          ls src/*.java >> sources.txt
          javac -source 1.7 -target 1.7 -encoding UTF-8 -nowarn \
                -cp src/lib/Alpha.jar -d build @sources.txt

      - name: Test (no calculator required)
        run: |
          set -e
          mkdir -p testbuild
          javac -encoding UTF-8 -d testbuild src/FaceplatePanel.java tests/FaceplateMapTest.java
          java -Djava.awt.headless=true -cp testbuild FaceplateMapTest .

      - name: Package nRemote.jar (no-libs)
        run: |
          set -e
          rm -rf build/com                      # drop the compile-only TI stubs
          cp src/load.png src/nremote.png src/faceplate.png build/
          cp VERSION build/nremote-version.txt  # app reads its version from here
          mkdir -p out/artifacts/nRemote_noLibs
          jar cfm out/artifacts/nRemote_noLibs/nRemote.jar \
              src/META-INF/MANIFEST.MF -C build .
          jar tf out/artifacts/nRemote_noLibs/nRemote.jar

      - name: Read version
        id: v
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: nRemote-jar
          path: out/artifacts/nRemote_noLibs/nRemote.jar
          if-no-files-found: error

      - name: Publish release (master push, new version only)
        if: github.event_name == 'push' && steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: nRemote v${{ steps.v.outputs.version }}
          files: out/artifacts/nRemote_noLibs/nRemote.jar
          generate_release_notes: true
